[project]
name = "bloodline"
version = "1.0.0"
description = "Pick your great-grandparents wisely. An educational game about Mendelian inheritance and the multinomial distribution."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.50",
    "numpy>=1.26",
    "pandas>=2.0",
    "qrcode>=7.4",
    "gspread>=6.0",
    "google-auth>=2.20",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "nbformat>=5.9",
    "nbconvert>=7.0",
    "ipykernel>=6.0",
    "openpyxl>=3.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
